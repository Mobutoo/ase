services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ase
      POSTGRES_USER: ase
      POSTGRES_PASSWORD: ase-preprod-2026
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ase"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ase:
    build: .
    expose:
      - "8000"
    environment: &ase-env
      DATABASE_URL: "postgres://ase:ase-preprod-2026@postgres:5432/ase"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      SECRET_KEY: "preprod-secret-key-not-for-production-use"
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://128.140.40.106,https://asepprd.ewutelo.cloud"
      # IAM — use allauth for preprod, OIDC disabled
      IAM_BACKEND: "lldap"
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      OIDC_ISSUER_URL: ""
      # Agent IA
      AGENT_ENABLED: "true"
      AGENT_RATE_LIMIT: "20"
      LITELLM_URL: ""
      # CalDAV
      CALDAV_EXTERNAL_URL: "https://asepprd.ewutelo.cloud/caldav"
      # Timezone
      TZ: "Europe/Paris"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  celery:
    build: .
    command: ["celery", "-A", "ase_project", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *ase-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.preprod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ase:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
