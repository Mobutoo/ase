services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ase
      POSTGRES_USER: ase
      POSTGRES_PASSWORD: ase-preprod-2026
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ase"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ase:
    build: .
    expose:
      - "8000"
    environment:
      DATABASE_URL: "postgres://ase:ase-preprod-2026@postgres:5432/ase"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "preprod-secret-key-not-for-production-use"
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://128.140.40.106,https://asepprd.ewutelo.cloud"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.preprod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ase:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
